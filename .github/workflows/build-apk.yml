name: Build Echolicense APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download libv2ray.aar & Iran Geo Assets
        run: |
          mkdir -p app/libs app/src/main/assets
          curl -sL "https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest" \
            | grep "browser_download_url.*aar" | head -n 1 | cut -d '"' -f 4 \
            | xargs curl -L -o app/libs/libv2ray.aar
          curl -L -o app/src/main/assets/geoip.dat "https://github.com/Chocolate4U/Iran-v2ray-rules/releases/latest/download/geoip.dat"
          curl -L -o app/src/main/assets/geosite.dat "https://github.com/Chocolate4U/Iran-v2ray-rules/releases/latest/download/geosite.dat"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Echolicense-VPN-APK
          path: app/build/outputs/apk/debug/*.apk
