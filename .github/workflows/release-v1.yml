name: Echolicense v1.9 Official Release (Android + PC)

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "announcements.json"
      - "send_notif.sh"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Apply custom branding logo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil
          python3 - << 'PY_LOGO'
          import os
          from PIL import Image

          src = next((p for p in ["branding/logo.png", "branding/logo.jpg", "branding/logo.jpeg"] if os.path.exists(p)), None)
          if src:
              img = Image.open(src).convert("RGBA")
              side = min(img.size)
              l, t = (img.width - side) // 2, (img.height - side) // 2
              sq = img.crop((l, t, l + side, t + side))

              bg_color = sq.getpixel((4, 4))
              pad = int(side * 0.06)
              canvas = Image.new("RGBA", (side + pad * 2, side + pad * 2), bg_color)
              canvas.paste(sq, (pad, pad))

              for folder, px in [
                  ("mipmap-mdpi", 48),
                  ("mipmap-hdpi", 72),
                  ("mipmap-xhdpi", 96),
                  ("mipmap-xxhdpi", 144),
                  ("mipmap-xxxhdpi", 192),
              ]:
                  d = f"app/src/main/res/{folder}"
                  os.makedirs(d, exist_ok=True)
                  resized = canvas.resize((px, px), Image.LANCZOS)
                  resized.save(f"{d}/ic_launcher.png")
                  resized.save(f"{d}/ic_launcher_round.png")

              for xml in [
                  "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml",
                  "app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml",
              ]:
                  if os.path.exists(xml):
                      os.remove(xml)
              print("✅ Custom Echolicense logo applied to Android mipmaps!")
          else:
              print("Using built-in Echolicense vector logo.")
          PY_LOGO

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          else
            keytool -genkeypair -v -keystore app/release.jks \
              -storepass "${KEYSTORE_PASSWORD:-EcholicenseV1Release!}" \
              -keypass "${KEY_PASSWORD:-EcholicenseV1Release!}" \
              -alias "${KEY_ALIAS:-echolicense}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Echolicense, OU=VPN, O=Echolicense, C=DE"
          fi

      - name: Download libv2ray.aar & Iran Geo Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/libs app/src/main/assets
          AAR_URL=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest" | grep "browser_download_url.*aar" | head -n 1 | cut -d '"' -f 4)
          curl -fL -o app/libs/libv2ray.aar "$AAR_URL"
          curl -fL -o app/src/main/assets/geoip.dat "https://github.com/Chocolate4U/Iran-v2ray-rules/releases/latest/download/geoip.dat"
          curl -fL -o app/src/main/assets/geosite.dat "https://github.com/Chocolate4U/Iran-v2ray-rules/releases/latest/download/geosite.dat"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Official Signed Release APK & Play Store AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk Echolicense-Android-v1.9.apk
          cp app/build/outputs/bundle/release/app-release.aab Echolicense-Android-v1.9.aab

      - name: Upload Android Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Echolicense-Android-v1.9
          path: |
            Echolicense-Android-v1.9.apk
            Echolicense-Android-v1.9.aab

  build-windows-pc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies & build icon
        working-directory: pc
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python generate_icon.py

      - name: Download sing-box, Wintun, Native WireGuard-NT & Iran Rule-Sets
        shell: pwsh
        working-directory: pc
        run: |
          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v1.10.7/sing-box-1.10.7-windows-amd64.zip" -OutFile "singbox.zip"
          Expand-Archive -Path "singbox.zip" -DestinationPath "singbox_tmp" -Force
          Copy-Item "singbox_tmp\sing-box-1.10.7-windows-amd64\sing-box.exe" -Destination "sing-box.exe"
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "wintun.zip"
          Expand-Archive -Path "wintun.zip" -DestinationPath "wintun_tmp" -Force
          Copy-Item "wintun_tmp\wintun\bin\amd64\wintun.dll" -Destination "wintun.dll"
          try {
            Invoke-WebRequest -Uri "https://download.wireguard.com/windows-client/wireguard-amd64-0.5.3.msi" -OutFile "wg.msi"
            Start-Process msiexec.exe -ArgumentList "/a `"$PWD\wg.msi`" /qb TARGETDIR=`"$PWD\wg_tmp`"" -Wait
            $wgExe = Get-ChildItem -Path "wg_tmp" -Recurse -Filter "wireguard.exe" | Select-Object -First 1
            if ($wgExe) {
              Copy-Item $wgExe.FullName -Destination "wireguard.exe"
              Get-ChildItem -Path $wgExe.DirectoryName -Filter "*.dll" | ForEach-Object { Copy-Item $_.FullName -Destination $_.Name }
            }
          } catch { Write-Host "WireGuard extract skipped: $_" }
          try { Invoke-WebRequest -Uri "https://raw.githubusercontent.com/SagerNet/sing-geoip/rule-set/geoip-ir.srs" -OutFile "geoip-ir.srs" } catch {}
          try { Invoke-WebRequest -Uri "https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-ir.srs" -OutFile "geosite-ir.srs" } catch {}

      - name: Build Windows EcholicenseVPN.exe & Setup Installer
        shell: pwsh
        working-directory: pc
        run: |
          python -c "import time, re; from pathlib import Path; p=Path('main.py'); p.write_text(re.sub(r'BUILD_EPOCH\s*=\s*\d+', f'BUILD_EPOCH = {int(time.time())}', p.read_text('utf-8'), count=1), 'utf-8')"
          pyinstaller --noconfirm --onefile --windowed --uac-admin --name "EcholicenseVPN" --icon "assets\icon.ico" --add-data "ui;ui" --add-data "assets;assets" main.py
          New-Item -ItemType Directory -Force -Path "release_pkg" | Out-Null
          Copy-Item "dist\EcholicenseVPN.exe" -Destination "release_pkg\"
          Copy-Item "sing-box.exe" -Destination "release_pkg\"
          Copy-Item "wintun.dll" -Destination "release_pkg\"
          foreach ($opt in @("wireguard.exe", "tunnel.dll", "wireguard.dll", "geoip-ir.srs", "geosite-ir.srs")) {
            if (Test-Path $opt) { Copy-Item $opt -Destination "release_pkg\" }
          }
          Compress-Archive -Path "release_pkg\*" -DestinationPath "..\Echolicense-Windows-v1.9.zip" -Force

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) {
              $iscc = $cmd.Source
            } else {
              choco install innosetup -y --no-progress
              $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            }
          }
          & $iscc "/DAppVersion=1.9" "/DSourceDir=release_pkg" "/DOutputDir=.." "/DIconFile=assets\icon.ico" "installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows PC Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Echolicense-Windows-v1.9
          path: |
            Echolicense-Windows-Setup-v1.9.exe
            Echolicense-Windows-v1.9.zip

  publish-release:
    needs: [build-android, build-windows-pc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Publish Official GitHub Release v1.9
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9
          name: "Echolicense VPN v1.9 (Android + Windows PC)"
          body: |
            ## Echolicense VPN v1.9 Official Release
            - **Windows PC Installer**: Official Setup (`Echolicense-Windows-Setup-v1.9.exe`) with Start Menu & Desktop shortcut + clean uninstall
            - **Windows PC Portable**: Portable archive (`Echolicense-Windows-v1.9.zip`)
            - **Android**: Signed Release APK (`Echolicense-Android-v1.9.apk`) & Google Play AAB (`Echolicense-Android-v1.9.aab`)
          files: |
            release-files/Echolicense-Android-v1.9/*
            release-files/Echolicense-Windows-v1.9/*
